<div class="relative flex min-h-dvh w-full flex-col bg-background-dark text-text-light">
  <header class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-border-dark bg-background-dark/80 px-4 backdrop-blur-sm">
    <a routerLink="/inventory" class="flex items-center justify-center p-2 -ml-2">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </a>
    <h1 class="text-lg font-bold text-gray-100">Registrar Entrada de Stock</h1>
    <div class="w-8"></div>
  </header>

  <main class="flex-1 overflow-y-auto p-4 pb-24">
    <form [formGroup]="entryForm" (ngSubmit)="registerEntry()" class="space-y-6">
      <div>
        <label for="item" class="block text-sm font-medium text-text-muted mb-1">Ítem / Herramienta</label>
        <select id="item" formControlName="item" class="w-full bg-card-dark rounded-lg border-2 border-border-dark text-text-light focus:ring-2 focus:ring-primary focus:border-primary">
          <option value="" disabled>Seleccionar ítem</option>
          <option value="martillo">Martillo de Garra</option>
          <option value="taladro">Taladro Percutor</option>
          <option value="cemento">Cemento (Saco 25kg)</option>
        </select>
      </div>

      <div>
        <label for="quantity" class="block text-sm font-medium text-text-muted mb-1">Cantidad</label>
        <div class="flex items-center justify-between gap-4 bg-card-dark px-4 py-2 rounded-lg border-2 border-border-dark">
          <span class="material-symbols-outlined text-primary">inventory_2</span>
          <div class="flex items-center gap-2 text-white">
            <button type="button" (click)="entryForm.patchValue({ quantity: entryForm.value.quantity - 1 })" [disabled]="entryForm.value.quantity <= 1" class="flex h-8 w-8 items-center justify-center rounded-full bg-border-dark disabled:opacity-50">-</button>
            <input formControlName="quantity" type="number" class="w-12 p-0 text-center bg-transparent border-none text-lg font-bold focus:ring-0">
            <button type="button" (click)="entryForm.patchValue({ quantity: entryForm.value.quantity + 1 })" class="flex h-8 w-8 items-center justify-center rounded-full bg-border-dark">+</button>
          </div>
        </div>
      </div>
      
      <div>
        <label for="entryDate" class="block text-sm font-medium text-text-muted mb-1">Fecha de Entrada</label>
        <input id="entryDate" formControlName="entryDate" type="date" class="w-full bg-card-dark rounded-lg border-2 border-border-dark text-text-light placeholder:text-text-muted focus:ring-2 focus:ring-primary focus:border-primary">
      </div>
      
      <div>
        <label for="provider" class="block text-sm font-medium text-text-muted mb-1">Proveedor (Opcional)</label>
        <input id="provider" formControlName="provider" type="text" placeholder="Ej. Ferretería Central" class="w-full bg-card-dark rounded-lg border-2 border-border-dark text-text-light placeholder:text-text-muted focus:ring-2 focus:ring-primary focus:border-primary">
      </div>
      
      <div>
        <label for="notes" class="block text-sm font-medium text-text-muted mb-1">Observaciones (Opcional)</label>
        <textarea id="notes" formControlName="notes" placeholder="Añadir notas, nº de factura, etc." rows="3" class="w-full bg-card-dark rounded-lg border-2 border-border-dark text-text-light placeholder:text-text-muted focus:ring-2 focus:ring-primary focus:border-primary"></textarea>
      </div>
    </form>
  </main>

  <footer class="fixed bottom-0 left-0 right-0 z-10 border-t border-border-dark bg-background-dark/80 p-4 backdrop-blur-sm">
    <button (click)="registerEntry()" [disabled]="entryForm.invalid" class="h-14 w-full rounded-xl bg-primary text-lg font-bold text-background-dark disabled:bg-primary/50 disabled:cursor-not-allowed">
      Registrar Entrada
    </button>
  </footer>
</div>
