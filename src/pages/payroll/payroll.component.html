<div class="bg-background-dark text-text-light min-h-dvh">
  <header class="flex items-center p-4 sticky top-0 z-10 bg-background-dark/80 backdrop-blur-sm border-b border-border-dark">
    <div class="flex size-12 shrink-0 items-center justify-start -ml-2">
      <a routerLink="/finances" class="p-2">
        <span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
      </a>
    </div>
    <h1 class="text-white text-xl font-display font-bold leading-tight flex-1 text-center pr-10">Gestión de Nóminas</h1>
  </header>

  <main class="flex-grow p-4 pb-28">
    <section class="mb-6">
      <div class="rounded-xl bg-card-dark p-4 text-center">
        <p class="text-text-muted text-sm font-medium uppercase tracking-wider">Total a Pagar Seleccionado</p>
        <p class="text-primary text-4xl font-bold tracking-tight mt-2">
          {{ totalToPay() | currency:'$':'symbol':'1.2-2' }}
        </p>
      </div>
    </section>

    <section>
      <h2 class="font-display text-xl text-white mb-3">Empleados</h2>
      <form [formGroup]="payrollForm" class="space-y-3">
        @for (employee of employees(); track employee.id) {
          <label 
            class="flex items-center gap-4 rounded-xl bg-card-dark p-3 transition-colors"
            [class.border]="payrollForm.get(employee.id)?.value"
            [class.border-primary]="payrollForm.get(employee.id)?.value"
            [class.cursor-pointer]="employee.status === 'Pendiente'"
            [class.opacity-50]="employee.status === 'Pagado'"
          >
            <img [src]="employee.avatarUrl" [alt]="'Foto de ' + employee.name" class="h-12 w-12 rounded-full object-cover">
            <div class="flex-1">
              <p class="font-semibold text-white">{{ employee.name }}</p>
              <p class="text-sm text-text-muted">{{ employee.role }}</p>
            </div>
            <div class="text-right">
              <p class="font-bold text-white">{{ employee.salary | currency:'$':'symbol':'1.0-0' }}</p>
              @if (employee.status === 'Pendiente') {
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-300">
                  {{ employee.status }}
                </span>
              } @else {
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-green-500/20 text-green-400">
                  {{ employee.status }}
                </span>
              }
            </div>
            @if (employee.status === 'Pendiente') {
              <input type="checkbox" [formControlName]="employee.id" class="ml-2 h-5 w-5 rounded bg-border-dark border-text-muted text-primary focus:ring-primary">
            }
          </label>
        }
      </form>
    </section>
  </main>

  <footer class="fixed bottom-20 left-0 right-0 p-4 bg-gradient-to-t from-background-dark to-transparent z-10">
    <button 
      (click)="processPayment()" 
      [disabled]="totalToPay() === 0"
      class="w-full h-14 rounded-xl bg-primary text-background-dark text-lg font-bold flex items-center justify-center disabled:bg-primary/50 disabled:cursor-not-allowed">
       @if (selectedCount() > 0) {
        <span>Pagar a Seleccionados ({{ selectedCount() }})</span>
       } @else {
        <span>Pagar a Seleccionados</span>
       }
    </button>
  </footer>

</div>
