<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-dark font-display text-[#E0E0E0]">
  <!-- Top App Bar -->
  <header class="flex items-center p-4 pb-2 sticky top-0 bg-background-dark/80 backdrop-blur-sm z-10">
    <div class="flex size-12 shrink-0 items-center justify-start text-white">
      <a routerLink="/employees" class="p-2 -ml-2">
        <span class="material-symbols-outlined text-2xl">arrow_back_ios</span>
      </a>
    </div>
    <h1 class="flex-1 text-center font-display text-2xl font-bold tracking-tight text-primary">Sanciones y<br>Recompensas</h1>
    <div class="w-12 shrink-0"></div> <!-- Spacer -->
  </header>

  <!-- Search Bar -->
  <div class="px-4 py-3">
    <label class="relative flex items-center">
      <span class="material-symbols-outlined pointer-events-none absolute left-4 text-text-muted">search</span>
      <input class="w-full rounded-lg border-none bg-card-dark py-3 pl-12 pr-4 text-white placeholder-text-muted focus:ring-2 focus:ring-primary" placeholder="Buscar empleado..." type="text"/>
    </label>
  </div>

  <!-- Employee List -->
  <main class="flex-grow px-2 pb-4">
    <div class="flex flex-col">
      @for (employee of employees(); track employee.name) {
        <a href="#" class="flex items-center gap-4 rounded-lg p-2 hover:bg-card-dark transition-colors duration-200">
          <img [src]="employee.avatarUrl" [alt]="'Foto de perfil de ' + employee.name" class="h-14 w-14 rounded-full object-cover"/>
          <div class="flex-1">
            <p class="text-base font-medium text-white">{{ employee.name }}</p>
            <p class="text-sm text-text-muted">{{ employee.role }}</p>
          </div>
          <span class="material-symbols-outlined text-text-muted">chevron_right</span>
        </a>
      }
    </div>
  </main>

  <!-- Floating Action Buttons -->
  <div class="fixed bottom-24 right-6 flex flex-col items-center gap-4 z-10">
    <button class="flex h-14 w-14 items-center justify-center rounded-full bg-primary text-background-dark shadow-lg hover:bg-primary/90 transition-opacity" title="Añadir Recompensa">
      <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">star</span>
    </button>
    <button class="flex h-14 w-14 items-center justify-center rounded-full bg-card-dark text-primary shadow-lg ring-1 ring-inset ring-border-dark hover:bg-border-dark transition-colors" title="Añadir Sanción">
      <span class="material-symbols-outlined text-3xl">gavel</span>
    </button>
  </div>
</div>
